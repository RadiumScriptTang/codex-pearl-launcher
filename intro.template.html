document.querySelector('#record').onclick=async()=>{if(recording||!ready)return;recording=true;await setupSound();const wasClean=document.body.classList.contains('clean');document.body.classList.add('clean');const video=canvas.captureStream(60),stream=new MediaStream([...video.getVideoTracks(),...soundDestination.stream.getAudioTracks()]),chunks=[],mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x)),rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000,audioBitsPerSecond:192000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'})),a=document.createElement('a');a.href=url;a.download='心海开场-v8.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);video.getTracks().forEach(t=>t.stop());recording=false;if(!wasClean)document.body.classList.remove('clean')};replay();rec.start();setTimeout(()=>rec.stop(),(DURATION+.1)*1000)};
requestAnimationFrame(frame);
